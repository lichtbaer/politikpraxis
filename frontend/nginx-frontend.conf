# Nur statische SPA — Routing /api erfolgt im Edge-nginx (docker-compose.prod.yml)
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Issue #261: gzip für Text-/JSON-Assets (u.a. GeoJSON-Kartendaten)
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types application/json application/geo+json application/javascript text/css text/plain application/xml image/svg+xml;

  # Cache-Strategie (Qualitätsplan 2.2): Vite benennt Assets per Content-Hash →
  # ein Jahr cachebar. index.html und die Locale-JSONs sind nicht gehasht und
  # müssen bei jedem Deploy revalidiert werden (ETag/Last-Modified setzt nginx),
  # sonst behält der Browser eine alte index.html mit toten Asset-Verweisen.
  # `expires` statt `add_header`, damit Header aus dem server-Block (CSP)
  # in den location-Blöcken erhalten bleiben.
  location /assets/ {
    expires 1y;
  }

  location = /index.html {
    expires -1;
  }

  location /locales/ {
    expires -1;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Korrekter Content-Type für GeoJSON-Kartendaten (nginx' Standard-mime.types kennt geojson/geo.json nicht)
  location ~* \.(geojson|geo\.json)$ {
    default_type application/geo+json;
  }
}

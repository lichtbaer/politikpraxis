name: Deploy to Production

# Gated on the Lint workflow (ruff/mypy/bandit/pip-audit, eslint/npm audit,
# backend pytest, gitleaks, container scan, api-types-drift) succeeding on
# main — a push with red lint/security/test checks no longer deploys.
# See #262.
on:
  workflow_run:
    workflows: ["Lint"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-check:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Frontend Build
        run: cd frontend && npm run build

  deploy:
    needs: build-check
    runs-on: ubuntu-latest
    # SECURITY: DEPLOY_SSH_KEY muss ein Ed25519-Key für einen dedizierten
    # deploy-User ohne sudo-Rechte sein.
    # Auf dem Server in authorized_keys mit forced command absichern:
    #   command="/opt/politikpraxis/scripts/deploy.sh",no-pty,no-port-forwarding,
    #   no-agent-forwarding,no-X11-forwarding ssh-ed25519 AAAA...
    # Siehe docs/deployment.md für vollständige Anleitung.
    steps:
      # Fehlen die Secrets, bricht ssh-action nur mit "missing server host" ab.
      # Hier lieber klar sagen, welches Secret fehlt und wo es dokumentiert ist.
      - name: Check deploy secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          missing=()
          [ -n "$DEPLOY_HOST" ] || missing+=(DEPLOY_HOST)
          [ -n "$DEPLOY_USER" ] || missing+=(DEPLOY_USER)
          [ -n "$DEPLOY_SSH_KEY" ] || missing+=(DEPLOY_SSH_KEY)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=Deploy nicht konfiguriert::Fehlende Repository-Secrets: ${missing[*]} (Settings -> Secrets and variables -> Actions, siehe docs/deployment.md)"
            exit 1
          fi

      - name: Deploy via SSH
        # Auf einen Commit gepinnt (v1.2.5), weil dieser Schritt DEPLOY_SSH_KEY sieht.
        # Update: `git ls-remote https://github.com/appleboy/ssh-action refs/tags/<tag>`.
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          # Der von lint.yml geprüfte Commit — nicht der aktuelle Stand von main,
          # der inzwischen weitergelaufen sein kann.
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_SHA
          # Bei einem Forced-Command-Key (docs/deployment.md) wird dieses Skript nicht
          # ausgeführt; deploy.sh liest den SHA dann aus SSH_ORIGINAL_COMMAND.
          script: |
            set -e
            cd /opt/politikpraxis
            # Bootstrap: first run after this script was introduced won't have it yet.
            if [ ! -f scripts/deploy.sh ]; then
              git pull origin main
            fi
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh "$DEPLOY_SHA"

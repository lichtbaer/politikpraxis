name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # conftest.py::_db_available() prüft fest gegen diesen DB-Namen (#343).
          POSTGRES_DB: bundesrepublik
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DEBUG: "1"
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/bundesrepublik
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Backend Tests
        run: |
          cd backend
          pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          alembic upgrade head
          python -m pytest --tb=short

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend Tests
        run: |
          cd frontend
          npm ci
          npm run test

      - name: Frontend Build
        run: cd frontend && npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # SECURITY: DEPLOY_SSH_KEY muss ein Ed25519-Key für einen dedizierten
    # deploy-User ohne sudo-Rechte sein.
    # Auf dem Server in authorized_keys mit forced command absichern:
    #   command="/opt/politikpraxis/scripts/deploy.sh",no-pty,no-port-forwarding,
    #   no-agent-forwarding,no-X11-forwarding ssh-ed25519 AAAA...
    # Siehe docs/deployment.md für vollständige Anleitung.
    steps:
      - uses: actions/checkout@v7

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/politikpraxis
            # Bootstrap: first run after this script was introduced won't have it yet.
            if [ ! -f scripts/deploy.sh ]; then
              git pull origin main
            fi
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh

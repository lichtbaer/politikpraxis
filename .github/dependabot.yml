# Gruppierung (September 2026): Ungruppiert erzeugte Dependabot pro Paket einen
# eigenen PR — zuletzt 18 gleichzeitig offene. Das ist nicht nur Rauschen, es
# erzeugt zwei konkrete Fehlerklassen:
#
#   1. Pakete, die nur zusammen konsistent sind, werden getrennt gebumpt.
#      Beispiele aus dem 18er-Schwung: pydantic/pydantic_core (pip pinnt beide
#      exakt, pydantic 2.13.4 verlangt pydantic-core==2.46.4 — die beiden
#      Einzel-PRs waren einzeln wie zusammen nicht installierbar) und
#      react/react-dom (React 19 erzwingt zur Laufzeit exakt gleiche Versionen,
#      der react-only-Bump ließ 10 Testdateien nicht mehr laden).
#   2. Benachbarte Zeilen in requirements.txt / package.json und überlappende
#      Lockfile-Einträge kollidieren, sobald einer der PRs gemergt ist — jeder
#      weitere braucht dann einen Rebase.
#
# Minor+Patch laufen deshalb je Ecosystem als ein PR. Majors bleiben bewusst
# einzeln: die brauchen ohnehin eine Einzelfallprüfung.
#
# Nachgeschärft (September 2026, Runde 2):
#   - pydantic_core steht nicht mehr in requirements.txt (pydantic pinnt es exakt);
#     #470 hatte es auf 2.49.0 gebumpt, das keine pydantic-Version zulässt.
#   - vitest und @vitest/* laufen als eigene Gruppe inkl. Majors — getrennt
#     gebumpt (#447/#448) passen Runner und Coverage-Provider nicht zusammen.
#   - eslint-Majors werden ignoriert, bis eslint-plugin-jsx-a11y ESLint 10
#     unterstützt (#446 scheitert daran).
#
# Labels (Oktober 2026): Eigene Labels legt Dependabot nicht an — `dependencies`,
# `backend`, `frontend` und `docker` gab es im Repo nicht, jeder PR bekam eine
# Warnung und kein Label. Ohne `labels:` setzt Dependabot seine Standard-Labels
# (`dependencies` + Ecosystem, z. B. `python`, `javascript`, `docker`) und legt sie
# selbst an. GitHub Actions behält das vorhandene Label `ci`.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      backend-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      backend-security:
        applies-to: security-updates
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # Bis eslint-plugin-jsx-a11y ESLint 10 unterstützt (Peer-Dependency <= 9)
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
    groups:
      # Runner und Coverage-Provider nur gemeinsam (auch Majors) — Gruppen greifen
      # in Reihenfolge, daher vor frontend-minor-patch.
      vitest:
        applies-to: version-updates
        patterns:
          - "vitest"
          - "@vitest/*"
      frontend-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      frontend-security:
        applies-to: security-updates
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "ci"
    groups:
      github-actions:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # Python-Minor/Major wird bewusst manuell gezogen: Version muss synchron
      # mit pyproject.toml (requires-python/ruff/mypy) und lint.yml bleiben.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

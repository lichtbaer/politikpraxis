name: Deploy to Production

# Gated on the Lint workflow (ruff/mypy/bandit/pip-audit, eslint/npm audit,
# backend pytest, gitleaks, container scan, api-types-drift) succeeding on
# main — a push with red lint/security/test checks no longer deploys.
# See #262.
on:
  workflow_run:
    workflows: ["Lint"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  build-check:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Frontend Build
        run: cd frontend && npm run build

  deploy:
    needs: build-check
    runs-on: ubuntu-latest
    # SECURITY: DEPLOY_SSH_KEY muss ein Ed25519-Key für einen dedizierten
    # deploy-User ohne sudo-Rechte sein.
    # Auf dem Server in authorized_keys mit forced command absichern:
    #   command="/opt/politikpraxis/scripts/deploy.sh",no-pty,no-port-forwarding,
    #   no-agent-forwarding,no-X11-forwarding ssh-ed25519 AAAA...
    # Siehe docs/deployment.md für vollständige Anleitung.
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Deploy via SSH
        # TODO(#262): pin to a commit SHA. This step has access to
        # DEPLOY_SSH_KEY, making it the highest-priority target for SHA
        # pinning — but this sandbox's network policy only allows GitHub API
        # access to this repo, so the current v1.x commit SHA couldn't be
        # looked up and verified here. A follow-up with unrestricted network
        # access (or a maintainer) should pin this before relying on it.
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/politikpraxis
            # Bootstrap: first run after this script was introduced won't have it yet.
            if [ ! -f scripts/deploy.sh ]; then
              git pull origin main
            fi
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh

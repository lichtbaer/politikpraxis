server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Issue #261: gzip für Text-/JSON-Assets (u.a. GeoJSON-Kartendaten)
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types application/json application/geo+json application/javascript text/css text/plain application/xml image/svg+xml;

  # SMA-314: CSP blockiert externe Font/Script-Quellen (DSGVO-konform)
  add_header Content-Security-Policy "default-src 'self'; font-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' http://localhost:* ws://localhost:*; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Korrekter Content-Type für GeoJSON-Kartendaten (nginx' Standard-mime.types kennt geojson/geo.json nicht)
  location ~* \.(geojson|geo\.json)$ {
    default_type application/geo+json;
  }

  location /api {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          cd backend
          pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Pytest
        # No Postgres service here yet (tracked separately in #343) — DB-dependent
        # tests self-skip via the requires_db marker, matching prior deploy.yml behavior.
        run: cd backend && python -m pytest --tb=short

  backend-ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Upgrade build tools
        run: pip install --upgrade pip setuptools wheel

      - name: Install backend and lint tools
        run: pip install -r requirements-test.txt

      - name: Ruff check
        run: cd backend && ruff check app tests

      - name: Ruff format (check)
        run: cd backend && ruff format --check app tests

      - name: Mypy
        run: cd backend && mypy app

      - name: pip-audit (dependency security check)
        # PYSEC-2026-1325 (ecdsa/Minerva): no upstream fix; transitive via python-jose.
        # Removal tracked in #253 (migrate to PyJWT).
        run: pip install pip-audit && pip-audit -r backend/requirements.txt --ignore-vuln PYSEC-2026-1325

      - name: Bandit (Python security linter — HIGH severity blockiert)
        run: pip install bandit[toml] && cd backend && bandit -r app -c pyproject.toml -ll

  frontend-eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: ESLint
        run: cd frontend && npm run lint

      - name: Unit Tests
        run: cd frontend && npm run test

      - name: npm audit (dependency security check)
        run: cd frontend && npm audit --audit-level=critical

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks (secret scanning)
        # TODO(#262): pin to a specific gitleaks release tag instead of `:latest`
        # once a session with unrestricted network access can verify the current
        # release — this sandbox's network policy only allows GitHub API access
        # to this repo, so no tag/digest could be looked up here.
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --no-git -v --redact

  container-scan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: backend
            dockerfile: backend/Dockerfile.prod
          - name: frontend
            context: frontend
            dockerfile: frontend/Dockerfile.prod
    steps:
      - uses: actions/checkout@v7

      - name: Build ${{ matrix.name }} image
        # TODO(#262): pin to a commit SHA (see gitleaks TODO above for why this
        # couldn't be verified from this sandbox).
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: politikpraxis-${{ matrix.name }}:scan

      - name: Trivy scan (${{ matrix.name }})
        # TODO(#262): pin to a commit SHA (see gitleaks TODO above for why this
        # couldn't be verified from this sandbox).
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: politikpraxis-${{ matrix.name }}:scan
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  api-types-drift:
    # Stellt sicher, dass die generierten FE-API-Typen zum Backend-OpenAPI-Schema
    # passen (Issue #227, Typ-Contract). Drift lässt den Build fehlschlagen.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install backend (für OpenAPI-Export)
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -r backend/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Check API types are in sync with backend schema
        run: cd frontend && npm run check:api-types
